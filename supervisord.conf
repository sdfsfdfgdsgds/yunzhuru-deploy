[unix_http_server]
file=/var/run/supervisor.sock

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# PHP 内置服务器 + router.php 白名单过滤
[program:php]
# PHP 内置 server 默认单 worker，壳端 shell.php 慢请求会阻塞后台静态页面；开启多 worker 缓解队头阻塞。
command=env PHP_CLI_SERVER_WORKERS=8 php -S 0.0.0.0:8080 -t /var/www/html /var/www/html/router.php
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/php.log
stderr_logfile=/var/log/supervisor/php-error.log

# 注入守护进程（worker）
[program:worker]
command=php /var/www/html/service/worker.php
autostart=true
autorestart=true
priority=20
startsecs=3
startretries=10
stdout_logfile=/var/log/supervisor/worker.log
stderr_logfile=/var/log/supervisor/worker-error.log

# 已删应用配置桶/缓存持久化失效重试
[program:config-invalidation-worker]
command=php /var/www/html/service/app_config_invalidation_worker.php
autostart=true
autorestart=true
priority=31
startsecs=3
startretries=20
stdout_logfile=/var/log/supervisor/config-invalidation-worker.log
stderr_logfile=/var/log/supervisor/config-invalidation-worker-error.log

# API 域名池自动化调度
[program:api-domain-automation-worker]
command=php /var/www/html/service/api_domain_automation_worker.php
autostart=true
autorestart=true
priority=32
startsecs=3
startretries=20
stopsignal=TERM
stopwaitsecs=40
stdout_logfile=/var/log/supervisor/api-domain-automation-worker.log
stderr_logfile=/var/log/supervisor/api-domain-automation-worker-error.log
