<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>图片弹窗配置</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/element/css/index.css">
  <script src="/element/js/vue.global.js"></script>
  <script src="/element/js/index.full.js"></script>
  <style>
    .asset-option {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
    }
    .asset-option-url {
      color: #909399;
      font-size: 12px;
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .asset-toolbar {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .asset-preview-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .asset-preview-item {
      width: 92px;
      border: 1px solid #ebeef5;
      border-radius: 6px;
      padding: 6px;
      background: #fafafa;
    }
    .asset-preview-item img {
      width: 80px;
      height: 56px;
      object-fit: cover;
      border-radius: 4px;
      display: block;
    }
    .asset-preview-name {
      margin-top: 4px;
      font-size: 12px;
      color: #606266;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="app" style="padding: 20px">
      <el-alert
      title="全屏弹窗(开屏广告)一次只会展示一个，展示哪一个是随机的"
      type="error"
      style="margin-bottom: 20px;">
    </el-alert>
    <!-- 应用选择 -->
    <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 10px">
      <el-select v-model="selectedAppId" placeholder="选择应用" style="width: 300px" @change="changeApp">
        <el-option
          v-for="app in appList"
          :key="app.id"
          :label="`${app.name} | ${app.version} | ${app.package}`"
          :value="app.id">
        </el-option>
      </el-select>
      <el-button @click="loadApps">刷新应用列表</el-button>
      <el-button type="primary" @click="openAddDialog">添加弹窗</el-button>
      <el-button type="success" @click="openAssetDialog">图片素材库</el-button>
      <el-button type="warning" @click="openBatchDialog">批量修改弹窗</el-button>
    </div>

    <!-- 弹窗列表表格 -->
    <el-table ref="popupTableRef" :data="popupList" border style="margin-top: 10px" @selection-change="handleSelectionChange">
      <el-table-column type="selection" width="55"></el-table-column>
      <el-table-column label="ID" prop="id"></el-table-column>
      <el-table-column label="图标" width="60">
          <template #default="scope">
            <img
              :src="`/icon.php?id=${scope.row.config_id}`"
              style="width: 32px; height: 32px; object-fit: contain; border-radius: 6px;"
              alt="icon"
            />
          </template>
      </el-table-column>
      <el-table-column label="应用信息" prop="apk_info"></el-table-column>
      <el-table-column label="类型" prop="popup_type"></el-table-column>
      <el-table-column label="备注" prop="remark"></el-table-column>
      <el-table-column label="启用" prop="enable">
        <template v-slot="scope">
          <el-tag :type="scope.row.enable == 1 ? 'success' : 'info'">
            {{ scope.row.enable == 1 ? '是' : '否' }}
          </el-tag>
        </template>
      </el-table-column>
    
      <!-- 新增列：名单管理 -->
      <el-table-column label="名单管理">
        <template v-slot="scope">
            <el-button size="small" @click="showPopupList('whitelist', scope.row.id)">白名单</el-button>
            <el-button size="small" type="info" @click="showPopupList('blacklist', scope.row.id)">黑名单</el-button>

        </template>
      </el-table-column>
    
      <el-table-column label="操作">
        <template v-slot="scope">
          <el-button type="primary" size="small" @click="editPopup(scope.row)">编辑</el-button>
          <el-button type="danger" size="small" @click="deletePopup(scope.row)">删除</el-button>
        </template>
      </el-table-column>
    </el-table>

    <div style="margin-top: 15px; text-align: right;">
      <el-pagination
        background
        layout="total, prev, pager, next"
        :total="total"
        :page-size="limit"
        :current-page="page"
        @current-change="loadPopups"
      ></el-pagination>
    </div>


    <!-- 添加弹窗对话框 -->
    <el-dialog v-model="dialogVisible" :title="editMode ? '编辑弹窗' : '添加弹窗'" width="600px">
      <el-form :model="form" label-width="100px">
        <el-form-item label="类型">
          <el-select v-model="form.popup_type">
            <el-option label="图片弹窗" value="图片弹窗"></el-option>
            <el-option label="全屏弹窗" value="全屏弹窗"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="备注">
          <el-input v-model="form.remark"></el-input>
        </el-form-item>
        <el-form-item label="图片素材">
          <div style="width: 100%">
            <el-select
              v-model="form.asset_ids"
              multiple
              filterable
              clearable
              placeholder="选择图片素材"
              style="width: 100%"
              @visible-change="onAssetSelectVisible">
              <el-option
                v-for="asset in assetList"
                :key="asset.id"
                :label="asset.name"
                :value="asset.id">
                <div class="asset-option">
                  <span>{{ asset.name }}</span>
                  <span class="asset-option-url">{{ asset.url }}</span>
                </div>
              </el-option>
            </el-select>
            <div class="asset-toolbar">
              <el-button size="small" @click="loadAssets">刷新素材</el-button>
              <el-button size="small" type="primary" @click="openAssetEditDialog()">新增素材</el-button>
              <el-button size="small" @click="openAssetDialog">管理素材库</el-button>
            </div>
            <div class="asset-preview-list" v-if="selectedFormAssets.length">
              <div class="asset-preview-item" v-for="asset in selectedFormAssets" :key="asset.id">
                <img :src="asset.url" alt="preview">
                <div class="asset-preview-name">{{ asset.name }}</div>
              </div>
            </div>
          </div>
        </el-form-item>
        <el-form-item label="备用直链">
          <el-input type="textarea" v-model="form.imageUrl" :rows="3" placeholder="可选：直接填图片链接，每行一条"></el-input>
        </el-form-item>
        <el-form-item label="点击事件">
          <el-select v-model="form.clickAction" placeholder="选择点击动作" @change="updateClickTextPlaceholder">
            <el-option label="无动作" :value="0"></el-option>
            <el-option label="调用浏览器打开URL(需要加http前缀)" :value="1"></el-option>
            <el-option label="添加QQ群" :value="2"></el-option>
            <el-option label="退出APP" :value="3"></el-option>
            <el-option label="分享内容" :value="4"></el-option>
            <el-option label="复制内容到剪切板" :value="6"></el-option>
            <el-option label="打开窗口类" :value="7"></el-option>
          </el-select>
        </el-form-item>
        
        <el-form-item v-if="form.clickAction !== 0 && form.clickAction !== 3" :label="clickTextLabel">
          <el-input
            v-if="form.clickAction === 1"
            type="textarea"
            v-model="form.clickText"
            :rows="3"
            :placeholder="clickTextPlaceholder"></el-input>
          <el-input
            v-else
            v-model="form.clickText"
            :placeholder="clickTextPlaceholder"></el-input>
        </el-form-item>
        <el-form-item label="回调地址">
          <el-tooltip content="点击广告后广告信息会提交到该接口，用于统计点击次数" placement="top">
            <el-input v-model="form.callback" placeholder="请输入回调地址"></el-input>
          </el-tooltip>
        </el-form-item>
        <el-form-item label="倒计时(秒)">
          <el-input-number v-model="form.countdown" :min="1"></el-input-number>
        </el-form-item>
        <el-form-item label="防去除">
          <el-switch v-model="form.lock"></el-switch>
          <el-alert title="可防止弹窗被第三方程序拦截关闭,不能防逆向破解"></el-alert>
        </el-form-item>
        <el-form-item label="允许跳过">
          <el-switch v-model="form.canSkip"></el-switch>
        </el-form-item>
        <el-form-item label="自动关闭">
          <el-switch v-model="form.autoClose"></el-switch>
        </el-form-item>
        <el-form-item label="启用弹窗">
          <el-switch v-model="form.enable"></el-switch>
        </el-form-item>
      </el-form>
      <template v-slot:footer>
        <span class="dialog-footer">
          <el-button @click="dialogVisible = false">取消</el-button>
          <el-button type="primary" @click="submitForm">保存</el-button>
        </span>
      </template>
    </el-dialog>
    
    <el-dialog v-model="popupListDialogVisible" :title="currentListType === 'whitelist' ? '白名单(当窗口为这些类名的时候才会弹出)' : '黑名单(当窗口为这些类名的时候不弹)'">
        <el-alert title="如果你想让弹窗在指定窗口弹出,则将这个窗口类名加入白名单" type="info" style="margin-bottom: 20px"></el-alert>
      <el-button type="primary" @click="addListItem" style="margin-bottom: 10px">添加</el-button>
    
      <el-table :data="popupListData" border>
        <el-table-column label="ID" prop="id" width="60"></el-table-column>
        <el-table-column label="类名" prop="class_name"></el-table-column>
        <el-table-column label="备注" prop="remark"></el-table-column>
        <el-table-column label="创建时间" prop="created_at" width="180"></el-table-column>
        <el-table-column label="操作" width="100">
          <template #default="scope">
            <el-button type="danger" size="small" @click="deleteListItem(scope.row)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>
    </el-dialog>

    <el-dialog v-model="batchDialogVisible" title="批量修改弹窗" width="600px">
        

      <el-form :model="batchForm" label-width="100px">
        <el-form-item label="选择预设">
          <el-select
            v-model="presetPopupId"
            placeholder="从勾选的弹窗中选择一个作为预设"
            @change="applyPresetToForm"
            style="width: 100%">
            <el-option
              v-for="popup in selectedPopups"
              :key="popup.id"
              :label="`ID: ${popup.id} | 备注: ${popup.remark || '-'}`"
              :value="popup.id">
            </el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="类型">
          <el-select v-model="batchForm.popup_type">
            <el-option label="图片弹窗" value="图片弹窗"></el-option>
            <el-option label="全屏弹窗" value="全屏弹窗"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="备注">
          <el-input v-model="batchForm.remark"></el-input>
        </el-form-item>
        <el-form-item label="图片素材">
          <div style="width: 100%">
            <el-select
              v-model="batchForm.asset_ids"
              multiple
              filterable
              clearable
              placeholder="选择图片素材"
              style="width: 100%"
              @visible-change="onAssetSelectVisible">
              <el-option
                v-for="asset in assetList"
                :key="asset.id"
                :label="asset.name"
                :value="asset.id">
                <div class="asset-option">
                  <span>{{ asset.name }}</span>
                  <span class="asset-option-url">{{ asset.url }}</span>
                </div>
              </el-option>
            </el-select>
            <div class="asset-toolbar">
              <el-button size="small" @click="loadAssets">刷新素材</el-button>
              <el-button size="small" type="primary" @click="openAssetEditDialog()">新增素材</el-button>
            </div>
          </div>
        </el-form-item>
        <el-form-item label="备用直链">
          <el-input type="textarea" v-model="batchForm.imageUrl" :rows="3" placeholder="可选：直接填图片链接，每行一条"></el-input>
        </el-form-item>
        <el-form-item label="点击事件">
          <el-select v-model="batchForm.clickAction" @change="updateBatchClickPlaceholder">
            <el-option label="无动作" :value="0"></el-option>
            <el-option label="调用浏览器打开URL(需要加http前缀)" :value="1"></el-option>
            <el-option label="添加QQ群" :value="2"></el-option>
            <el-option label="退出APP" :value="3"></el-option>
            <el-option label="分享内容" :value="4"></el-option>
            <el-option label="复制内容到剪切板" :value="6"></el-option>
            <el-option label="打开窗口类" :value="7"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item v-if="batchForm.clickAction !== 0 && batchForm.clickAction !== 3" :label="batchClickTextLabel">
          <el-input
            v-if="batchForm.clickAction === 1"
            type="textarea"
            v-model="batchForm.clickText"
            :rows="3"
            :placeholder="batchClickTextPlaceholder"></el-input>
          <el-input
            v-else
            v-model="batchForm.clickText"
            :placeholder="batchClickTextPlaceholder"></el-input>
        </el-form-item>
        <el-form-item label="回调地址">
          <el-input v-model="batchForm.callback"></el-input>
        </el-form-item>
        <el-form-item label="防去除">
          <el-switch v-model="batchForm.lock"></el-switch>
          <el-alert title="可防止弹窗被第三方程序拦截关闭,不能防逆向破解"></el-alert>
        </el-form-item>
        <el-form-item label="倒计时(秒)">
          <el-input-number v-model="batchForm.countdown" :min="1"></el-input-number>
        </el-form-item>
        <el-form-item label="允许跳过">
          <el-switch v-model="batchForm.canSkip"></el-switch>
        </el-form-item>
        <el-form-item label="自动关闭">
          <el-switch v-model="batchForm.autoClose"></el-switch>
        </el-form-item>
        <el-form-item label="启用">
          <el-switch v-model="batchForm.enable"></el-switch>
        </el-form-item>
      </el-form>
      <template v-slot:footer>
        <span class="dialog-footer">
          <el-button @click="batchDialogVisible = false">取消</el-button>
          <el-button type="primary" @click="confirmBatchUpdate">保存</el-button>
        </span>
      </template>
    </el-dialog>

    <el-dialog v-model="assetDialogVisible" title="图片素材库" width="900px">
      <div style="display:flex; gap:10px; margin-bottom:12px; align-items:center">
        <el-input
          v-model="assetKeyword"
          placeholder="搜索名称、链接或备注"
          clearable
          style="width: 320px"
          @keyup.enter="loadAssets(1)"></el-input>
        <el-button @click="loadAssets(1)">查询</el-button>
        <el-button type="primary" @click="openAssetEditDialog()">新增图片</el-button>
      </div>
      <el-table :data="assetList" border v-loading="assetLoading">
        <el-table-column label="预览" width="90">
          <template #default="scope">
            <img :src="scope.row.url" style="width:60px;height:42px;object-fit:cover;border-radius:4px" alt="preview">
          </template>
        </el-table-column>
        <el-table-column label="图片名" prop="name" width="160"></el-table-column>
        <el-table-column label="图片链接" prop="url" show-overflow-tooltip></el-table-column>
        <el-table-column label="备注" prop="remark" width="160" show-overflow-tooltip></el-table-column>
        <el-table-column label="操作" width="150">
          <template #default="scope">
            <el-button size="small" type="primary" @click="openAssetEditDialog(scope.row)">编辑</el-button>
            <el-button size="small" type="danger" @click="deleteAsset(scope.row)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>
      <div style="margin-top: 12px; text-align: right">
        <el-pagination
          background
          layout="total, prev, pager, next"
          :total="assetTotal"
          :page-size="assetLimit"
          :current-page="assetPage"
          @current-change="loadAssets"></el-pagination>
      </div>
    </el-dialog>

    <el-dialog v-model="assetEditVisible" :title="assetEditMode ? '编辑图片素材' : '新增图片素材'" width="520px" append-to-body>
      <el-form :model="assetForm" label-width="90px">
        <el-form-item label="图片名">
          <el-input v-model="assetForm.name"></el-input>
        </el-form-item>
        <el-form-item label="图片链接">
          <el-input v-model="assetForm.url"></el-input>
        </el-form-item>
        <el-form-item label="备注">
          <el-input v-model="assetForm.remark"></el-input>
        </el-form-item>
        <el-form-item label="预览" v-if="assetForm.url">
          <img :src="assetForm.url" style="max-width:220px;max-height:140px;object-fit:contain;border:1px solid #ebeef5;border-radius:6px" alt="preview">
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="assetEditVisible = false">取消</el-button>
        <el-button type="primary" @click="submitAsset">保存</el-button>
      </template>
    </el-dialog>

<el-dialog v-model="addListDialogVisible" :title="addListDialogTitle" width="500px">
  <el-form :model="addListForm" label-width="100px">
    <el-form-item label="类名">
      <el-input v-model="addListForm.class_name" placeholder="请输入类名"></el-input>
    </el-form-item>

    <el-form-item label="备注">
      <el-input v-model="addListForm.remark" placeholder="备注可不填写"></el-input>
    </el-form-item>
  </el-form>

  <template #footer>
    <el-button @click="addListDialogVisible = false">取消</el-button>
    <el-button type="primary" @click="submitAddList">确认添加</el-button>
  </template>
</el-dialog>

    
    
  </div>

  <script>
    const { createApp, reactive, ref, computed, onMounted, getCurrentInstance, nextTick } = Vue;
    
    createApp({
      setup() {
        const appList = ref([]);
        const selectedAppId = ref(null);
        const popupList = ref([]);
        const dialogVisible = ref(false);
        const editMode = ref(false);
        const { proxy } = getCurrentInstance();
        const popupTableRef = ref(null);
        const page = ref(1);
        const limit = ref(20);
        const total = ref(0);

        const form = reactive({
          id: null,
          popup_type: '',
          remark: '',
          imageUrl: '',
          asset_ids: [],
          clickAction: 0,
          clickText: '',
          callback: '',
          countdown: 3,
          canSkip: false,
          autoClose: false,
          enable: false,
          lock: false
        });
        const presetPopupId = ref(null);
        const addListDialogVisible = ref(false)
        const addListDialogTitle = ref('')
        const addListType = ref('whitelist') // whitelist / blacklist
        
        const addListForm = reactive({
          class_name: '',
          remark: ''
        })
        const assetDialogVisible = ref(false);
        const assetEditVisible = ref(false);
        const assetEditMode = ref(false);
        const assetLoading = ref(false);
        const assetList = ref([]);
        const assetPage = ref(1);
        const assetLimit = ref(20);
        const assetTotal = ref(0);
        const assetKeyword = ref('');
        const assetForm = reactive({
          id: null,
          name: '',
          url: '',
          remark: ''
        });
        const selectedFormAssets = computed(() => {
          const ids = Array.isArray(form.asset_ids) ? form.asset_ids : [];
          return assetList.value.filter(asset => ids.includes(asset.id));
        });

        function mergeAssets(assets) {
          if (!Array.isArray(assets) || assets.length === 0) return;
          const existed = new Set(assetList.value.map(asset => asset.id));
          assets.forEach(asset => {
            if (asset && asset.id && !existed.has(asset.id)) {
              assetList.value.push(asset);
              existed.add(asset.id);
            }
          });
        }

        async function loadAssets(p = assetPage.value) {
          if (typeof p !== 'number') {
            p = assetPage.value || 1;
          }
          assetPage.value = p || 1;
          assetLoading.value = true;
          try {
            const res = await fetch('/api/index.php?module=popup_image_asset&method=getList', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                page: assetPage.value,
                limit: assetLimit.value,
                keyword: assetKeyword.value
              })
            });
            const json = await res.json();
            if (json.code === 200) {
              assetList.value = json.data.list || [];
              assetTotal.value = json.data.total || 0;
            } else {
              ElementPlus.ElMessage.error(json.message || '素材加载失败');
            }
          } finally {
            assetLoading.value = false;
          }
        }

        function onAssetSelectVisible(visible) {
          if (visible && assetList.value.length === 0) {
            loadAssets(1);
          }
        }

        function openAssetDialog() {
          assetDialogVisible.value = true;
          loadAssets(1);
        }

        function openAssetEditDialog(row = null) {
          if (row) {
            assetEditMode.value = true;
            Object.assign(assetForm, {
              id: row.id,
              name: row.name || '',
              url: row.url || '',
              remark: row.remark || ''
            });
          } else {
            assetEditMode.value = false;
            Object.assign(assetForm, {
              id: null,
              name: '',
              url: '',
              remark: ''
            });
          }
          assetEditVisible.value = true;
        }

        async function submitAsset() {
          if (!assetForm.url.trim()) {
            ElementPlus.ElMessage.warning('请填写图片链接');
            return;
          }
          const method = assetEditMode.value ? 'editAsset' : 'addAsset';
          const res = await fetch(`/api/index.php?module=popup_image_asset&method=${method}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...assetForm })
          });
          const json = await res.json();
          if (json.code === 200) {
            ElementPlus.ElMessage.success(json.message || '保存成功');
            assetEditVisible.value = false;
            await loadAssets(assetPage.value);
            if (!assetEditMode.value && json.data && json.data.id && dialogVisible.value) {
              form.asset_ids = Array.from(new Set([...(form.asset_ids || []), json.data.id]));

              batchForm.asset_ids = Array.from(new Set([...(batchForm.asset_ids || []), json.data.id]));

        async function deleteAsset(row) {
          await ElementPlus.ElMessageBox.confirm(`确认删除图片素材：${row.name}?`, '警告', { type: 'warning' });
          const res = await fetch('/api/index.php?module=popup_image_asset&method=deleteAsset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: row.id })
          });

          if (json.code === 200) {
            ElementPlus.ElMessage.success('删除成功');
            form.asset_ids = (form.asset_ids || []).filter(id => id !== row.id);
            batchForm.asset_ids = (batchForm.asset_ids || []).filter(id => id !== row.id);

          } else {
            ElementPlus.ElMessage.error(json.message || '删除失败');

        async function loadApps() {
          const res = await fetch('/api/index.php?module=config&method=getMyApps');

async function loadPopups(p = 1) {
  page.value = p;

  const params = {
    page: page.value,
    limit: limit.value
  };

  if (selectedAppId.value) {
    params.apk_id = selectedAppId.value;
  }

  const res = await fetch('/api/index.php?module=popup_image&method=getList', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(params)
  });

  const json = await res.json();
  if (json.code === 200) {
    popupList.value = json.data.list;
    popupList.value.forEach(row => mergeAssets(row.image_assets));
    total.value = json.data.total;

    // 恢复勾选
    const key = `popup_checked_ids_${selectedAppId.value || 'all'}`;
    const savedIds = JSON.parse(localStorage.getItem(key) || '[]');

    nextTick(() => {
      if (proxy.$refs.popupTableRef && savedIds.length) {
        popupList.value.forEach(row => {
          if (savedIds.includes(row.id)) {
            proxy.$refs.popupTableRef.toggleRowSelection(row, true);
          }
        });
      }
    });
  }
}

function changeApp() {
  page.value = 1;
  loadPopups(1);
}

// 多选回调
function handleSelectionChange(val) {
  selectedPopups.value = val;
  const ids = val.map(item => item.id);
  const key = `popup_checked_ids_${selectedAppId.value || 'all'}`;
  localStorage.setItem(key, JSON.stringify(ids));
}


// 更新点击事件提示
function updateBatchClickPlaceholder(val) {
  switch (val) {
    case 1:
      batchClickTextLabel.value = '打开链接';
      batchClickTextPlaceholder.value = '请输入要打开的网址，如：https://xxx.com';
      break;
    case 2:
      batchClickTextLabel.value = 'QQ群Key';
      batchClickTextPlaceholder.value = '在QQ群官方地址获取安卓加群连接';
      break;
    case 3:
      batchClickTextLabel.value = '事件参数';
      batchClickTextPlaceholder.value = '不需要参数';
      break;
    case 4:
      batchClickTextLabel.value = '分享内容';
      batchClickTextPlaceholder.value = '请输入要分享的文本内容';
      break;
    case 6:
      batchClickTextLabel.value = '复制内容';
      batchClickTextPlaceholder.value = '请输入要复制的文本内容';
      break;
    case 7:
      batchClickTextLabel.value = '窗口类名';
      batchClickTextPlaceholder.value = '请输入要打开的完整窗口类名，例如com.abc.shell.ManiActivity';
      break;
    default:
      batchClickTextLabel.value = '事件参数';
      batchClickTextPlaceholder.value = '无参数';
  }
}

// 批量保存
async function confirmBatchUpdate() {
  await ElementPlus.ElMessageBox.confirm(
    '此操作会将勾选的弹窗统一设置为本次提交的信息，是否继续？',
    '提示',
    { type: 'warning' }
  );

  if (!hasImageSource(batchForm)) {
    ElementPlus.ElMessage.warning('请选择图片素材或填写备用直链');
    return;
  }
  const ids = selectedPopups.value.map(item => item.id);
  const payload = { ...batchForm, ids, apk_id: selectedAppId.value };

  const res = await fetch('/api/index.php?module=popup_image&method=batchUpdate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  const json = await res.json();
  if (json.code === 200) {
    ElementPlus.ElMessage.success('批量修改成功');
    batchDialogVisible.value = false;
    loadPopups();
  } else {
    ElementPlus.ElMessage.error(json.message || '批量修改失败');
  }
}
