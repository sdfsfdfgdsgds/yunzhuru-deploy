<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>链接与事件参数资源库</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/element/css/index.css">
  <script src="/element/js/vue.global.js"></script>
  <script src="/element/js/index.full.js"></script>
  <script src="/pages/config/common/click_param_asset.js?v=202609022033"></script>
  <style>
    body {
      margin: 0;
      background: #fff;
      color: #303133;
    }
    #app {
      padding: 20px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    /*
     * 管理主题会把小尺寸输入框拉高到 34px，Element Plus 仍使用
     * 11px 的小尺寸调整按钮，从而在两个按钮中间留出空隙。
     * 本页的排序控件统一为 34px，上下按钮各占 16px，保持连续的中线边框。
     */
    .sort-number-input.el-input-number {
      height: 34px;
      line-height: 32px;
    }
    .sort-number-input.el-input-number .el-input {
      --el-input-height: 34px;
      --el-input-inner-height: 32px;
      height: 34px;
    }
    .sort-number-input.el-input-number .el-input__wrapper {
      min-height: 34px;
    }
    .sort-number-input.el-input-number.is-controls-right .el-input-number__decrease,
    .sort-number-input.el-input-number.is-controls-right .el-input-number__increase {
      --el-input-number-controls-height: 16px;
    }
    .sort-form-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .sort-form-hint {
      color: #909399;
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="toolbar">
      <el-select
        v-model="filterAction"
        placeholder="事件分类"
        clearable
        style="width: 180px"
        @change="value => loadParams(value, 1)">
        <el-option v-for="item in clickActionOptions" :key="item.value" :label="item.label" :value="item.value"></el-option>
      </el-select>
      <el-input
        v-model="keyword"
        placeholder="搜索名称、参数或备注"
        clearable
        style="width: 320px"
        @keyup.enter="loadParams(filterAction, 1)"></el-input>
      <el-button @click="loadParams(filterAction, 1)">查询</el-button>
      <el-button type="primary" @click="openEditDialog()">新增参数</el-button>
    </div>

    <el-table :data="list" border v-loading="loading">
      <el-table-column label="名称" prop="name" width="180"></el-table-column>
      <el-table-column label="事件分类" width="130">
        <template #default="scope">{{ clickActionLabel(scope.row.action_type) }}</template>
      </el-table-column>
      <el-table-column label="排序" width="150" align="center">
        <template #default="scope">
          <el-input-number
            class="sort-number-input"
            :model-value="scope.row.sort"
            :min="-10000"
            :max="10000"
            size="small"
            controls-position="right"
            title="数值越大越靠前"
            style="width: 110px"
            :disabled="sortSavingId !== 0"
            @change="value => updateParamSort(scope.row, value)"></el-input-number>
        </template>
      </el-table-column>
      <el-table-column label="状态" width="100" align="center">
        <template #default="scope">
          <el-switch
            :model-value="scope.row.enabled === 1"
            @change="toggleParamStatus(scope.row)"></el-switch>
        </template>
      </el-table-column>
      <el-table-column label="事件参数" prop="param_text" show-overflow-tooltip></el-table-column>
      <el-table-column label="备注" prop="remark" width="180" show-overflow-tooltip></el-table-column>
      <el-table-column label="更新时间" prop="updated_at" width="170"></el-table-column>
      <el-table-column label="操作" width="160" fixed="right">
        <template #default="scope">
          <el-button size="small" type="primary" @click="openEditDialog(scope.row)">编辑</el-button>
          <el-button size="small" type="danger" @click="removeParam(scope.row)">删除</el-button>
        </template>
      </el-table-column>
    </el-table>

    <div style="margin-top: 14px; text-align: right">
      <el-pagination
        background
        layout="total, prev, pager, next"
        :total="total"
        :page-size="limit"
        :current-page="page"
        @current-change="page => loadParams(filterAction, page)"></el-pagination>
    </div>

    <el-dialog v-model="editVisible" :title="editMode ? '编辑事件参数' : '新增事件参数'" width="560px">
      <el-form :model="form" label-width="90px">
        <el-form-item label="参数名">
          <el-input v-model="form.name" placeholder="例如：官网链接、QQ群、卡密接口"></el-input>
        </el-form-item>
        <el-form-item label="事件分类">
          <el-select v-model="form.action_type" style="width: 100%">
            <el-option v-for="item in clickActionOptions" :key="item.value" :label="item.label" :value="item.value"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="排序">
          <div class="sort-form-row">
            <el-input-number
              v-model="form.sort"
              class="sort-number-input"
              :min="-10000"
              :max="10000"
              :step="1"
              controls-position="right"
              style="width: 180px"></el-input-number>
            <span class="sort-form-hint">数值越大越靠前，默认 0</span>
          </div>
        </el-form-item>
        <el-form-item :label="clickParamLabel(form.action_type)">
          <el-input
            :type="clickTextInputType(form.action_type)"
            v-model="form.param_text"
            :rows="4"
            :placeholder="clickParamPlaceholder(form.action_type)"></el-input>
        </el-form-item>
        <el-form-item label="启用">
          <el-switch v-model="form.enabled"></el-switch>
        </el-form-item>
        <el-form-item label="备注">
          <el-input v-model="form.remark"></el-input>
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="editVisible = false">取消</el-button>
        <el-button type="primary" @click="submitParam">保存</el-button>
      </template>
    </el-dialog>
  </div>

  <script>
    const { createApp, ref, onMounted } = Vue;

    createApp({
      setup() {
        const clickParamStore = ClickParamAsset.createStore(Vue, ElementPlus);
        const filterAction = ref(null);
        const list = clickParamStore.list;
        const page = clickParamStore.page;
        const limit = clickParamStore.limit;
        const total = clickParamStore.total;
        const keyword = clickParamStore.keyword;
        const loading = clickParamStore.loading;
        const editVisible = clickParamStore.editVisible;
        const editMode = clickParamStore.editMode;
        const sortSavingId = clickParamStore.sortSavingId;
        const form = clickParamStore.form;
        const clickActionOptions = ClickParamAsset.ACTION_OPTIONS;
        const clickActionLabel = ClickParamAsset.actionLabel;
        const clickParamLabel = ClickParamAsset.paramLabel;
        const clickParamPlaceholder = ClickParamAsset.paramPlaceholder;
        const clickTextInputType = ClickParamAsset.paramInputType;

        function loadParams(actionType = filterAction.value, targetPage = page.value) {
          return clickParamStore.load(actionType, targetPage);
        }

        function openEditDialog(row = null) {
          if (row) {
            clickParamStore.openEdit(row);
            return;
          }
          clickParamStore.openEdit(null, filterAction.value || 1);
        }

        function submitParam() {
          return clickParamStore.submit();
        }

        function removeParam(row) {
          return clickParamStore.remove(row);
        }

        function toggleParamStatus(row) {
          return clickParamStore.toggleEnabled(row);
        }

        function updateParamSort(row, value) {
          return clickParamStore.setSort(row, value);
        }

        onMounted(() => {
          editVisible.value = false;
          loadParams(null, 1);
        });

        return {
          filterAction,
          list,
          page,
          limit,
          total,
          keyword,
          loading,
          editVisible,
          editMode,
          sortSavingId,
          form,
          clickActionOptions,
          clickActionLabel,
          clickParamLabel,
          clickParamPlaceholder,
          clickTextInputType,
          loadParams,
          openEditDialog,
          submitParam,
          removeParam,
          toggleParamStatus,
          updateParamSort
        };
      }
    }).use(ElementPlus).mount('#app');
  </script>
</body>
</html>
