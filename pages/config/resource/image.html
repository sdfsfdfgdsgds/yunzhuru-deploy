<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>图片资源库</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/element/css/index.css">
  <script src="/element/js/vue.global.js"></script>
  <script src="/element/js/index.full.js"></script>
  <style>
    body {
      margin: 0;
      background: #fff;
      color: #303133;
    }
    #app {
      padding: 20px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .preview-img {
      width: 72px;
      height: 48px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #ebeef5;
      display: block;
      background: #f5f7fa;
    }
    .edit-preview {
      max-width: 240px;
      max-height: 150px;
      object-fit: contain;
      border: 1px solid #ebeef5;
      border-radius: 6px;
      background: #f5f7fa;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="toolbar">
      <el-input
        v-model="keyword"
        placeholder="搜索图片名、链接或备注"
        clearable
        style="width: 320px"
        @keyup.enter="loadAssets(1)"></el-input>
      <el-button @click="loadAssets(1)">查询</el-button>
      <el-button type="primary" @click="openEditDialog()">新增图片</el-button>
    </div>

    <el-table :data="assetList" border v-loading="loading">
      <el-table-column label="预览" width="100">
        <template #default="scope">
          <img :src="scope.row.url" class="preview-img" alt="preview">
        </template>
      </el-table-column>
      <el-table-column label="图片名" prop="name" width="180"></el-table-column>
      <el-table-column label="图片链接" prop="url" show-overflow-tooltip></el-table-column>
      <el-table-column label="备注" prop="remark" width="180" show-overflow-tooltip></el-table-column>
      <el-table-column label="更新时间" prop="updated_at" width="170"></el-table-column>
      <el-table-column label="操作" width="160" fixed="right">
        <template #default="scope">
          <el-button size="small" type="primary" @click="openEditDialog(scope.row)">编辑</el-button>
          <el-button size="small" type="danger" @click="deleteAsset(scope.row)">删除</el-button>
        </template>
      </el-table-column>
    </el-table>

    <div style="margin-top: 14px; text-align: right">
      <el-pagination
        background
        layout="total, prev, pager, next"
        :total="total"
        :page-size="limit"
        :current-page="page"
        @current-change="loadAssets"></el-pagination>
    </div>

    <el-dialog v-model="editVisible" :title="editMode ? '编辑图片资源' : '新增图片资源'" width="520px">
      <el-form :model="form" label-width="90px">
        <el-form-item label="图片名">
          <el-input v-model="form.name"></el-input>
        </el-form-item>
        <el-form-item label="图片链接">
          <el-input v-model="form.url"></el-input>
        </el-form-item>
        <el-form-item label="备注">
          <el-input v-model="form.remark"></el-input>
        </el-form-item>
        <el-form-item label="预览" v-if="form.url">
          <img :src="form.url" class="edit-preview" alt="preview">
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="editVisible = false">取消</el-button>
        <el-button type="primary" @click="submitAsset">保存</el-button>
      </template>
    </el-dialog>
  </div>

  <script>
    const { createApp, ref, reactive, onMounted } = Vue;

    createApp({
      setup() {
        const assetList = ref([]);
        const page = ref(1);
        const limit = ref(20);
        const total = ref(0);
        const keyword = ref('');
        const loading = ref(false);
        const editVisible = ref(false);
        const editMode = ref(false);
        const form = reactive({
          id: null,
          name: '',
          url: '',
          remark: ''
        });

        async function loadAssets(p = page.value) {
          if (typeof p !== 'number') {
            p = page.value || 1;
          }
          page.value = p || 1;
          loading.value = true;
          try {
            const res = await fetch('/api/index.php?module=popup_image_asset&method=getList', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                page: page.value,
                limit: limit.value,
                keyword: keyword.value
              })
            });
            const json = await res.json();
            if (json.code === 200) {
              assetList.value = json.data.list || [];
              total.value = json.data.total || 0;
            } else {
              ElementPlus.ElMessage.error(json.message || '图片资源加载失败');
            }
          } finally {
            loading.value = false;
          }
        }

        function openEditDialog(row = null) {
          if (row) {
            editMode.value = true;
            Object.assign(form, {
              id: row.id,
              name: row.name || '',
              url: row.url || '',
              remark: row.remark || ''
            });
          } else {
            editMode.value = false;
            Object.assign(form, {
              id: null,
              name: '',
              url: '',
              remark: ''
            });
          }
          editVisible.value = true;
        }

        async function submitAsset() {
          if (!String(form.url || '').trim()) {
            ElementPlus.ElMessage.warning('请填写图片链接');
            return;
          }
          const method = editMode.value ? 'editAsset' : 'addAsset';
          const res = await fetch(`/api/index.php?module=popup_image_asset&method=${method}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...form })
          });
          const json = await res.json();
          if (json.code === 200) {
            ElementPlus.ElMessage.success(json.message || '保存成功');
            editVisible.value = false;
            await loadAssets(page.value);
          } else {
            ElementPlus.ElMessage.error(json.message || '保存失败');
          }
        }

        async function deleteAsset(row) {
          await ElementPlus.ElMessageBox.confirm(`确认删除图片资源：${row.name}?`, '警告', { type: 'warning' });
          const res = await fetch('/api/index.php?module=popup_image_asset&method=deleteAsset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: row.id })
          });
          const json = await res.json();
          if (json.code === 200) {
            ElementPlus.ElMessage.success('删除成功');
            await loadAssets(page.value);
          } else {
            ElementPlus.ElMessage.error(json.message || '删除失败');
          }
        }

        onMounted(() => {
          loadAssets(1);
        });

        return {
          assetList,
          page,
          limit,
          total,
          keyword,
          loading,
          editVisible,
          editMode,
          form,
          loadAssets,
          openEditDialog,
          submitAsset,
          deleteAsset
        };
      }
    }).use(ElementPlus).mount('#app');
  </script>
</body>
</html>
